<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="dashboard">

    <div class="topbar">

      <div class="topbar-left">

        <h1>Task Manager</h1>

        <p class="welcome-text" id="welcomeText"></p>

      </div>

      <div class="topbar-right">

        <a href="profile.html" class="profile-link">Profile</a>

        <button id="logoutBtn">Logout</button>

      </div>

    </div>
    <div class="stats">

  <div class="stat-box">
    <h2 id="totalTasks">0</h2>
    <p>Total</p>
  </div>

  <div class="stat-box">
    <h2 id="completedTasks">0</h2>
    <p>Completed</p>
  </div>

  <div class="stat-box">
    <h2 id="pendingTasks">0</h2>
    <p>Pending</p>
  </div>

</div>

    <div class="insights">

      <div class="ring-box">

        <div class="ring" id="completionRing">
          <span id="ringPercent">0%</span>
        </div>

        <p>Completion</p>

      </div>

      <div class="activity-box">

        <h3>Last 7 days</h3>

        <div class="bars" id="activityBars"></div>

      </div>

    </div>

    <form id="taskForm">

      <input type="text" id="taskTitle" placeholder="Task title" required>

      <input type="text" id="taskDescription" placeholder="Task description">

      <input type="date" id="taskDate">

      <button type="submit">Add Task</button>

    </form>

    <div class="toolbar">

      <input type="search" id="taskSearch" placeholder="Search tasks...">

      <select id="taskFilter">
        <option value="all">All status</option>
        <option value="Pending">Pending</option>
        <option value="Completed">Completed</option>
      </select>

      <select id="taskSort">
        <option value="newest">Newest first</option>
        <option value="oldest">Oldest first</option>
        <option value="due">Due date</option>
        <option value="title">Title A-Z</option>
      </select>

    </div>

    <div id="taskList"></div>

    <button type="button" id="loadMoreBtn" class="load-more" hidden>
      Load more
    </button>

  </div>

  <div class="modal-overlay" id="editModal">

    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="editModalTitle">

      <div class="modal-header">

        <h2 id="editModalTitle">Edit Task</h2>

        <button type="button" class="modal-close" id="modalClose">&times;</button>

      </div>

      <form id="editTaskForm">

        <input type="text" id="editTitle" placeholder="Task title" required>

        <input type="text" id="editDescription" placeholder="Task description">

        <select id="editStatus">
          <option value="Pending">Pending</option>
          <option value="Completed">Completed</option>
        </select>

        <input type="date" id="editDate">

        <div class="modal-buttons">

          <button type="button" class="cancel-btn" id="modalCancel">Cancel</button>

          <button type="submit">Save Changes</button>

        </div>

      </form>

    </div>

  </div>

  <script src="script.js"></script>

</body>
</html>
